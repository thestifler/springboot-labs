# Configuracion base de Mexibank.
#
# Usa variables de entorno para las credenciales (ver .env.example en la raiz).
# La migracion de esquema la gestiona Flyway: ddl-auto debe ser validate.
#
# En properties la estructura se expressa con puntos en la clave, no con
# indentacion: spring.datasource.hikari.maximum-pool-size es el equivalente de
# el bloque "spring: > datasource: > hikari: > maximum-pool-size" en YAML.

spring.application.name=mexibank

# --- Datos de conexion -------------------------------------------------------
# Apunta a PostgreSQL local. Las credenciales vienen SIEMPRE por entorno
# (DB_URL, DB_USERNAME y DB_PASSWORD; tambien funciona la convencion de Spring,
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD).
#
# El usuario por defecto es el de la base local de desarrollo, que es publico y
# no sirve para nada mas. El de la contrasena esta vacio a proposito, igual que
# el del administrador de mas abajo: escribir una contrasena real aqui la
# publicaria en el repositorio para quien clone, y eso no lo arregla que este
# archivo "es solo de desarrollo". Ver .env.example.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mexibank}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones Hikari. Valores razonables para desarrollo; ajustar en
# entornos reales.
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# --- JPA / Hibernate ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Sin Open Session in View. Con esta opcion abierta, Hibernate mantiene la
# sesion abierta durante el renderizado de la vista y las consultas se ejecutan
# desde fuera de la transaccion, donde no hay control de concurrencia. En una
# arquitectura hexagonal el acceso a datos ocurre en los casos de uso, dentro de
# @Transactional, asi que la sesion no hace falta para el renderizado.
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

# NO se fija hibernate.dialect: Hibernate lo detecta desde el JDBC. Declararlo a
# mano produce el aviso HHH90000025 y, si la version de la base dejara de estar
# soportada, se pierde funcionalidad en silencio.
#
# Mejora el orden de inserciones en entidades con relaciones.
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Evita cargar colecciones completas por error en algunas consultas.
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# --- Flyway: dueno del esquema ------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Impide ejecutar "flyway clean" por error contra una base real.
spring.flyway.clean-disabled=true

# Comprueba que los scripts ya aplicados siguen coincidiendo con su checksum.
spring.flyway.validate-on-migrate=true

# Cada script se aplica por separado, sin agruparlos en una transaccion unica.
# Es lo que permite que una migracion fallida no revierta las anteriores.
spring.flyway.group=false

# No usamos schema.sql ni data.sql para crear el esquema: de eso se encarga
# Flyway.
spring.sql.init.mode=never

# --- Logging -----------------------------------------------------------------
logging.level.root=info
logging.level.mexibank=debug

# Hibernate: logea el SQL formateado y los parametros de enlace.
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

# Flyway imprime su progreso (scripts aplicados, versions, etc).
logging.level.org.flywaydb=info

# --- Actuator ----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- Seguridad: firma de tokens JWT -------------------------------------------
#
# El secreto de firma NUNCA debe ir en un archivo. Este valor por defecto es solo
# para arrancar en local y esta pensado para fallar: si alguien despliega esta
# configuracion tal cual, todos los sistemas comparten el mismo secreto y cualquiera
# puede firmar tokens de administrador.
#
# En produccion: JWT_SECRET=<base64 de openssl rand -base64 32>
# ConfiguracionProperties valida la longitud en bytes al arrancar, asi que una
# clave corta falla al inicio en vez de firmar con HMAC debil en silencio.
mexibank.security.jwt.secret=${JWT_SECRET:UExBQ0VIT0xERVItTE9DQUwtMzItQllURVMtMDAwMDAwMDAwMDA=}
mexibank.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}

# --- Bootstrap del primer administrador ----------------------------------------
#
# POST /api/v1/users exige el rol ADMIN, asi que sin un administrador ya
# existente no hay forma de crear el primero: la API se cierra sobre si misma.
# Esta seccion rompe el bucle, y solo cuando se rellenan las dos propiedades.
#
# estan vacias a proposito. Escribir una contrasena de administrador en un
# archivo es exactamente lo que la nota de JWT_SECRET de mas arriba rechaza, y
# no por ser menos secreto: quien clone el repositorio tendria las credenciales
# del administrador del banco. Se pasan por entorno o por linea de comandos:
#
#   ./mvnw spring-boot:run \
#     -Dspring-boot.run.arguments=--mexibank.bootstrap.admin.email=admin@correo.com \
#     -Dspring-boot.run.arguments=--mexibank.bootstrap.admin.password=<12+ caracteres>
#
# El alta pasa por el caso de uso de creacion de usuarios, asi que el
# administrador cumple la misma PasswordPolicy y se hashea con el mismo
# BCrypt que cualquier otro usuario. Si la contrasena no la cumple, la
# aplicacion NO arranca: es preferible a levantar un sistema con un
# administrador invalido.
#
# Es idempotente (si el correo ya existe no hace nada), asi que se puede dejar
# puesta y reiniciar sin miedo. Aun asi, en un despliegue real conviene
# quitarla: dejarla puesta significa que cualquiera que pueda cambiar las
# variables del despliegue puede crear un administrador.
#
# Ver readme.md, seccion "Como se crea el primer administrador".
# mexibank.bootstrap.admin.email=
# mexibank.bootstrap.admin.password=

# --- Documentacion de la API (OpenAPI / Swagger UI) ---------------------------
#
# springdoc lee los controladores y los DTO y publica el contrato OpenAPI en la
# ruta de abajo; swagger-ui es la pagina navegable que ademas permite probar los
# endpoints. Ninguna de las dos exige token, por eso sus rutas estan en la lista
# de permitAll de SecurityConfig.
#
# En un despliegue real se apagan sin tocar codigo:
#   springdoc.api-docs.enabled=false
#   springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Servidor ----------------------------------------------------------------
server.port=${SERVER_PORT:8080}