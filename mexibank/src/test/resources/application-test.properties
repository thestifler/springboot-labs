# Perfil de tests.
#
# Testcontainers NO se configura aqui: el contenedor lo declara
# AbstractPostgresIT con @ServiceConnection y Spring Boot sobreescribe url,
# usuario y contrasena automaticamente. Poner una URL fija en este archivo seria
# contraproducente, porque Spring la aplicaria ENCIMA de la del contenedor.
#
# Lo que si se fija aqui es el comportamiento de JPA y Flyway, que debe ser
# identico al de produccion.

# --- Datasource por defecto: H2 en memoria ------------------------------------
#
# Es un RESERVA. Sirve para los tests que no necesitan la base de datos real (el
# de carga del contexto, los de dominio, los de arquitectura) y asi no exigen
# Docker en cada build.
#
# En los tests que si necesitan PostgreSQL, @ServiceConnection sobre el
# contenedor sobreescribe estos valores: los ConnectionDetails tienen prioridad
# sobre las properties, que es justamente su motivo de existir.
#
# DB_CLOSE_DELAY=-1 evita que la base en memoria se destruya al cerrar la primera
# conexion. Sin el, el esquema (y los datos) desaparecen entre conexiones.
spring.datasource.url=jdbc:h2:mem:mexibank_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---------------------------------------------------------
# Flyway crea el esquema y Hibernate solo comprueba que coincide. En los tests
# con Testcontainers esto reproduce lo que hace produccion, y por eso un
# desajuste entre entidad y migracion falla aqui y no al desplegar.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ------------------------------------------------------------------
# En H2 el esquema lo crea Flyway igual que en PostgreSQL. Para que los scripts
# de migracion se ejecuten tambien contra H2 deben ser SQL estandar; cuando se
# escriba una migracion especifica de PostgreSQL habra que aislarla por motor o
# subir ese test a Testcontainers.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Impide que un test destruya el esquema por error. En una base efimera de test
# no aporta nada y solo deja la puerta abierta a un clean accidental.
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

spring.sql.init.mode=never

# --- Seguridad ---------------------------------------------------------------
#
# Clave de firma propia de los tests, distinta de la de produccion.
#
# <strong>Por que el perfil test NO hereda el secreto por defecto.</strong> Si los
# tests usaran el mismo secreto que application.properties, un test que firmara un
# token produciria algo indistinguible de uno real, y un fallo de validacion pasaria
# desapercibido. Con claves distintas, cada entorno tiene su propio material
# criptografico.
#
# El valor es una cadena legible en lugar de aleatoria a proposito: cuando un test
# falle al arrancar con "clave demasiado corta", ver el valor en el mensaje de
# error ahorra tener que ir a buscar la variable de entorno.
mexibank.security.jwt.secret=${JWT_SECRET:dGVzdC1vbmx5LWtleS1ub3QtdXNlZC1pbi1wcm9kdWN0aW9uISE=}
mexibank.security.jwt.expiration-minutes=15

# --- Logging -----------------------------------------------------------------
logging.level.mexibank=debug
logging.level.org.flywaydb=info

# Los tests de seguridad generan 401 y 403 esperados a proposito. Sin esto, el log
# de los AccessDeniedHandler llenaria la salida de la build con lineas de WARN que
# no son un fallo y hacen mas dificil ver los que si lo son.
logging.level.mexibank.infrastructure.security.filter=ERROR