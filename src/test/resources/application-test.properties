# H2 en memoria
spring.datasource.url=jdbc:h2:mem:task_manager_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate crea las tablas a partir de tus @Entity
spring.jpa.hibernate.ddl-auto=create-drop

# Carga de datos de prueba
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# CLAVE: Permite que data.sql se ejecute DESPUÉS de que Hibernate cree la tabla
spring.jpa.defer-datasource-initialization=true