# Perfil de desarrollo. NO activar en produccion.

# Crear/actualizar el esquema al arrancar. En una base de datos real esto debe
# ser 'validate' y las migraciones deben correr por otra via (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
