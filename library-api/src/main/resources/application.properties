spring.application.name=library-api

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# La configuracion de desarrollo (ddl-auto, show-sql) vive en
# application-dev.properties. En un entorno real se arranca con
# SPRING_PROFILES_ACTIVE=prod y su propia configuracion de base de datos.
spring.profiles.active=dev
